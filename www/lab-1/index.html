<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Personal Pages</title>
  <style>
    :root {
      --rbr-navy: #0b1329;
      --rbr-blue: #142247;
      --rbr-red: #e10600;
      --rbr-yellow: #ffb81c;
      --rbr-card: rgba(17, 28, 56, 0.9);
      --text-light: #f1f5f9;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--rbr-navy);
      color: var(--text-light);
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
    }

    #header {
      background-color: var(--rbr-blue);
      padding: 20px;
      text-align: center;
      border-bottom: 3px solid var(--rbr-red);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    #title {
      color: #fff;
      margin: 0;
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 2px 2px 0 var(--rbr-red);
    }

    #menu {
      background-color: var(--rbr-navy);
      border-bottom: 2px solid #1e355e;
    }

    #iframe {
      width: 100%;
      height: 40px;
      border: none;
      display: block;
    }

    #content {
      padding: 20px;
      min-height: 450px;
      max-width: 900px;
      margin: 30px auto;
      background-color: var(--rbr-card);
      border: 1px solid #1e355e;
      border-top: 4px solid var(--rbr-yellow);
      border-radius: 12px;
      text-align: center;
      font-size: 1.1rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    #footer {
      background-color: #060e18;
      height: 50px;
      line-height: 50px;
      text-align: center;
      border-top: 2px solid #1e355e;
      color: #94a3b8;
    }

    #footnote {
      font-weight: bold;
      color: var(--rbr-yellow);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div id="header">
    <h1 id="title">My Personal Pages</h1>
  </div>

  <div id="menu">
    <iframe id="iframe" src="menu.html" title="Menu"></iframe>
  </div>

  <div id="content">
    🏁 "Enter the pitlane — select a menu above to start your lap." 🏎️⚡<br><br>
    
    <!-- Gambar kini diletakkan di dalam div content -->
    <img src="redbull-f1.jpg" alt="Red Bull Racing F1" style="display: block; margin: 20px auto; max-width: 75%; height: auto; border-radius: 12px; border: 2px solid rgba(56, 189, 248, 0.4); box-shadow: 0 5px 15px rgba(0,0,0,0.5);">
  </div>

  <div id="footer">
    <span id="footnote">Web Programming &#64; UKM &trade;</span>
  </div>

</body>
</html>

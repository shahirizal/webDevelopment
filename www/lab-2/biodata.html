            <hr class="border-secondary opacity-25 mb-4">

            <form action="http://lrgs.ftsm.ukm.my/users/a123456/lab-2/validate_biodata.php" method="post" enctype="multipart/form-data">
                
                <div class="row">
                    <!-- Name -->
                    <div class="col-md-6 form-group-custom">
                        <label class="form-label-custom">Full Name</label>
                        <input type="text" name="name" placeholder="Insert your name" autofocus required pattern="^([A-Z][a-z]+)(\s[A-Z][a-z]+)*$" title="Name must be in Title Case (e.g. Khai Qian Khan)">
                    </div>

                    <!-- Age -->
                    <div class="col-md-6 form-group-custom">
                        <label class="form-label-custom">Age</label>
                        <input type="number" name="age" min="0" max="100" step="1" placeholder="Enter age" required>
                    </div>
                </div>

                <div class="row">
                    <!-- Gender -->
                    <div class="col-md-6 form-group-custom">
                        <label class="form-label-custom">Gender</label>
                        <div class="radio-group d-flex gap-4">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="male" name="gender" value="male" checked required>
                                <label class="form-check-label text-white" for="male">Male</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="female" name="gender" value="female" required>
                                <label class="form-check-label text-white" for="female">Female</label>
                            </div>
                        </div>
                    </div>

                    <!-- Date of Birth -->
                    <div class="col-md-6 form-group-custom">
                        <label class="form-label-custom">Date of Birth</label>
                        <input type="date" name="dob" required>
                    </div>
                </div>

                <div class="row">
                    <!-- Email -->
                    <div class="col-md-6 form-group-custom">
                        <label class="form-label-custom">Email Address</label>
                        <input type="email" name="email" placeholder="user@ukm.edu.my" required pattern="^[a-zA-Z0-9._%+-]+@([a-zA-Z0-9.-]+\.)*ukm\.[a-zA-Z0-9.-]+$" title="Email must contain 'ukm'">
                    </div>

                    <!-- Tel -->
                    <div class="col-md-6 form-group-custom">
                        <label class="form-label-custom">Telephone Number</label>
                        <input type="tel" name="phone" placeholder="+60##-#######" required pattern="^(\+60|0060)[0-9\- ]{8,14}$" title="Must begin with +60 or 0060">
                    </div>
                </div>

                <div class="row">
                    <!-- Height -->
                    <div class="col-md-6 form-group-custom">
                        <label class="form-label-custom">Height (<output id="outputId" class="fw-bold text-info">150</output> cm)</label>
                        <div class="radio-group py-2">
                            <input type="range" name="height" id="heightId" min="100" max="200" value="150" oninput="outputId.value = heightId.value" required class="form-range w-100">
                        </div>
                    </div>

                    <!-- Favorite Color -->
                    <div class="col-md-6 form-group-custom">
                        <label class="form-label-custom">Favorite Color</label>
                        <input type="color" name="color" value="#008000" required style="height: 44px; padding: 4px; cursor: pointer;">
                    </div>
                </div>

                <div class="row">
                    <!-- Social Media URL -->
                    <div class="col-md-6 form-group-custom">
                        <label class="form-label-custom">FB / TW / IG URL</label>
                        <input type="url" name="fbtwig" placeholder="https://" required>
                    </div>

                    <!-- University -->
                    <div class="col-md-6 form-group-custom">
                        <label class="form-label-custom">University</label>
                        <select name="university" required class="form-select">
                            <option value="">Select University</option>
                            <option value="UKM" selected>Universiti Kebangsaan Malaysia</option>
                            <option value="UM">Universiti Malaya</option>
                            <option value="UPM">Universiti Putra Malaysia</option>
                            <option value="USM">Universiti Sains Malaysia</option>
                            <option value="UTM">Universiti Teknologi Malaysia</option>
                            <option value="UiTM">Universiti Teknologi MARA</option>
                            <option value="UUM">Universiti Utara Malaysia</option>
                            <option value="UIAM">Universiti Islam Antarabangsa Malaysia</option>
                            <option value="UNIMAS">Universiti Malaysia Sarawak</option>
                            <option value="UMS">Universiti Malaysia Sabah</option>
                        </select>
                    </div>
                </div>

                <!-- Face Photo -->
                <div class="form-group-custom">
                    <label class="form-label-custom">Face Photo Upload</label>
                    <input type="file" name="photo" accept="image/png, image/jpeg, image/jpg, image/gif" required class="form-control">
                </div>

                <!-- Address -->
                <div class="form-group-custom">
                    <label class="form-label-custom">Home Address</label>

    <script>
        const htmlEl = document.documentElement;
        const themeBtn = document.getElementById("theme-toggle");
        const savedTheme = localStorage.getItem("rbr_theme") || "dark";
        htmlEl.setAttribute("data-theme", savedTheme);
        updateThemeIcon(savedTheme);
        themeBtn.onclick = () => {
            const current = htmlEl.getAttribute("data-theme");
            const next = current === "dark" ? "light" : "dark";
            htmlEl.setAttribute("data-theme", next);
            localStorage.setItem("rbr_theme", next);
            updateThemeIcon(next);
        };
        function updateThemeIcon(t) {
            themeBtn.innerHTML = t === "dark" ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun text-warning"></i>';
        }
    </script>

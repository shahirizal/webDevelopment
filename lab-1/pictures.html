<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Favorite Media</title>
  <style>
    :root {
      --rbr-navy: #0b1329;
      --rbr-blue: #142247;
      --rbr-red: #e10600;
      --rbr-yellow: #ffb81c;
      --rbr-card: rgba(17, 28, 56, 0.9);
      --text-light: #f1f5f9;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--rbr-navy);
      color: var(--text-light);
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
    }

    #header {
      background-color: var(--rbr-blue);
      padding: 20px;
      text-align: center;
      border-bottom: 3px solid var(--rbr-red);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    #title {
      color: #fff;
      margin: 0;
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 2px 2px 0 var(--rbr-red);
    }

    #menu {
      background-color: var(--rbr-navy);
      border-bottom: 2px solid #1e355e;
    }

    #iframe {
      width: 100%;
      height: 40px;
      border: none;
      display: block;
    }

    #content {
      padding: 30px;
      min-height: 550px;
      max-width: 900px;
      margin: 30px auto;
      background-color: var(--rbr-card);
      border: 1px solid #1e355e;
      border-top: 4px solid var(--rbr-yellow);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    #tblpictures {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid #1e355e;
    }

    #tblpictures th, #tblpictures td {
      border: 1px solid #1e355e;
      padding: 15px;
      text-align: center;
      color: var(--text-light);
    }

    #tblpictures th {
      background-color: var(--rbr-blue);
      color: var(--rbr-yellow);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #tblpictures img {
      max-width: 80%;
      height: auto;
      border-radius: 8px;
      border: 2px solid rgba(56, 189, 248, 0.3);
    }

    audio, video {
      width: 100%;
      max-width: 300px;
      outline: none;
      border-radius: 6px;
    }

    #footer {
      background-color: #060e18;
      height: 50px;
      line-height: 50px;
      text-align: center;
      border-top: 2px solid #1e355e;
      color: #94a3b8;
    }

    #footnote {
      font-weight: bold;
      color: var(--rbr-yellow);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div id="header">
    <h1 id="title">My Favorite Media</h1>
  </div>

  <div id="menu">
    <iframe id="iframe" src="menu.html" title="Menu"></iframe>
  </div>

  <div id="content">
    <table id="tblpictures" border="1">
      <tr>
        <th colspan="2">Multimedia Showcase</th>
      </tr>
      <tr>
        <th>Static Picture</th>
        <th>Animated Picture</th>
      </tr>
      <tr>
        <td align="center">
          <!-- Ganti 'static.jpg' dengan nama fail imej statik kau dalam folder -->
          <a href="static.jpg" target="_blank">
            <img src="static.jpg" alt="Favorite Static Picture">
          </a>
        </td>
        <td align="center">
          <!-- Ganti 'animated.gif' dengan nama fail GIF kau dalam folder -->
          <a href="max.gif" target="_blank">
            <img src="max.gif" alt="Favorite Animated GIF">
          </a>
        </td>
      </tr>
      <tr>
        <th>Music</th>
        <th>Video</th>
      </tr>
      <tr>
       <td align="center">
         <iframe width="100%" height="200" src="https://www.youtube.com/embed/WgTMeICssXY" title="YouTube Music player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="border-radius: 8px;"></iframe>
       </td>
        <td align="center">
          <!-- Ganti 'video.mp4' dengan fail video kau -->
         <iframe width="100%" height="200" src="https://www.youtube.com/embed/FRTFp2vNP5w" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="border-radius: 8px;"></iframe>
        </td>
      </tr>
    </table>
  </div>

  <div id="footer">
    <span id="footnote">Web Programming</span>
  </div>

</body>
</html>
